---
# Variable contract for nginx_deploy, surfaced by
# GET /aapIntegration/playbooks/files so the UI can pre-fill extra vars.
# Merged with roles_reference/_acme_lib/vars/argument_spec.yml's shared
# variables (this file wins on a name collision). Internal derived variables
# (nginx_ssl_dir, acme_cert_file/key_file/fullchain_file/ca_file,
# acme_reload_cmd) are deliberately not listed here -- they're computed from
# common_name/reload_command, not something a caller should set directly.
# Prose source of truth: docs/design/acme-playbook-variables.md.

variables:
  - name: reload_command
    type: str
    required: false
    default: "systemctl reload nginx"
    secret: false
    description: >-
      Command used to reload nginx after installing the renewed
      certificate. Override per host/group if the unit name differs.
    choices: null

  - name: preflight_validation_command
    type: str
    required: false
    default: "nginx -t"
    secret: false
    description: 'Run before reloading the service. Set to "" to skip.'
    choices: null

  - name: cert_file_owner
    type: str
    required: false
    default: "root"
    secret: false
    description: Owner set on the installed certificate material.
    choices: null

  - name: cert_file_group
    type: str
    required: false
    default: "root"
    secret: false
    description: Group set on the installed certificate material.
    choices: null

  - name: cert_file_mode
    type: str
    required: false
    default: "0640"
    secret: false
    description: File mode set on the installed certificate material.
    choices: null

  - name: verify_port
    type: int
    required: false
    default: 443
    secret: false
    description: Port to TLS-probe for the post-deploy verification check.
    choices: null
