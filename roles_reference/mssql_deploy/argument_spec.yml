---
# Variable contract for mssql_deploy, surfaced by
# GET /aapIntegration/playbooks/files so the UI can pre-fill extra vars.
# Merged with roles_reference/_acme_lib/vars/argument_spec.yml's shared
# variables (this file wins on a name collision). Covers both the Linux and
# Windows branches (chosen automatically from ansible_os_family) -- the UI
# should show all of these regardless of target OS. Internal derived
# variables (mssql_ssl_dir, acme_cert_file/key_file/fullchain_file/ca_file,
# acme_pfx_dir, acme_pfx_file) are deliberately not listed here.
# Prose source of truth: docs/design/acme-playbook-variables.md.

variables:
  - name: mssql_cert_owner
    type: str
    required: false
    default: "mssql"
    secret: false
    description: 'Linux only: owner set on the installed certificate material.'
    choices: null

  - name: mssql_cert_group
    type: str
    required: false
    default: "mssql"
    secret: false
    description: 'Linux only: group set on the installed certificate material.'
    choices: null

  - name: mssql_cert_mode
    type: str
    required: false
    default: "0640"
    secret: false
    description: 'Linux only: file mode set on the installed certificate material.'
    choices: null

  - name: reload_command
    type: str
    required: false
    default: "systemctl restart mssql-server"
    secret: false
    description: 'Linux only: restarts mssql-server to pick up the new certificate.'
    choices: null

  - name: acme_pfx_password
    type: str
    required: true
    default: null
    secret: true
    description: >-
      Windows only. Protects the issued PFX at rest. No default -- always
      supply via extraVars/host_vars.
    choices: null

  - name: mssql_instance_key
    type: str
    required: false
    default: "MSSQLServer"
    secret: false
    description: >-
      Windows only: the registry instance key under
      Microsoft SQL Server\<version>.<instance>\.
    choices: null

  - name: mssql_service_name
    type: str
    required: false
    default: "MSSQLSERVER"
    secret: false
    description: 'Windows only: the Windows service name to restart.'
    choices: null

  - name: preflight_validation_command
    type: str
    required: false
    default: ""
    secret: false
    description: 'Linux only: set to skip; no standard mssql-conf config-test equivalent.'
    choices: null

  - name: mssql_port
    type: int
    required: false
    default: 1433
    secret: false
    description: Port SQL Server listens on, used for the post-deploy verification check (Linux only).
    choices: null
