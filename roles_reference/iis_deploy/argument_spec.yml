---
# Variable contract for iis_deploy, surfaced by
# GET /aapIntegration/playbooks/files so the UI can pre-fill extra vars.
# Merged with roles_reference/_acme_lib/vars/argument_spec.yml's shared
# variables (this file wins on a name collision). acme_pfx_password isn't in
# the shared spec -- only the Windows-targeting playbooks (iis_deploy,
# mssql_deploy, custom_deploy) use it. Internal derived variables
# (acme_pfx_dir, acme_pfx_file) are deliberately not listed here.
# Prose source of truth: docs/design/acme-playbook-variables.md.

variables:
  - name: acme_pfx_password
    type: str
    required: true
    default: null
    secret: true
    description: >-
      Protects the issued PFX at rest; unrelated to any of the ACME account
      secrets. No default -- always supply via extraVars/host_vars.
    choices: null

  - name: iis_site_name
    type: str
    required: false
    default: "Default Web Site"
    secret: false
    description: The IIS site the renewed certificate is bound to.
    choices: null

  - name: iis_binding_ip
    type: str
    required: false
    default: "*"
    secret: false
    description: IP address of the HTTPS binding (creates it if missing).
    choices: null

  - name: iis_binding_port
    type: int
    required: false
    default: 443
    secret: false
    description: Port of the HTTPS binding (creates it if missing).
    choices: null
