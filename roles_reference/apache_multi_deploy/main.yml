---
# CertSecure ACME renewal playbook -- Apache httpd, explicit multi-server
#
# Same model as roles_reference/nginx_multi_deploy/main.yml (see that file's
# header for the full rationale and the shared `deploy_targets` schema) and
# the same two ACME flows as roles_reference/apache_deploy/main.yml (see
# docs/design/acme-playbook-variables.md for the full contract). Use this
# instead of apache_deploy when you want ONE job run to renew certs across
# many Apache servers AAP doesn't (or shouldn't need to) know about as
# Inventory hosts -- see nginx_multi_deploy/main.yml's header for why
# CertSecure's own batch launch mode isn't a substitute for this. Launch the
# Job Template against any placeholder inventory (e.g. "localhost", local
# connection) -- the real targets travel entirely inside extraVars as
# `deploy_targets`.
#
# `deploy_targets` is a list of objects, one per Apache server:
#   host                          (required) dynamic inventory name, and the
#                                 default for ansible_host/common_name below
#   ansible_host                  actual IP/FQDN to connect to, if different
#                                 from `host`
#   ansible_user / ansible_port / ansible_ssh_private_key_file /
#   ansible_password / ansible_become_password
#                                 per-server connection overrides -- since
#                                 these hosts are never in AAP Inventory,
#                                 connection details must come from here
#   common_name                   defaults to `host`
#   subject_alt_names             defaults to []
#   reload_command / preflight_validation_command / cert_file_owner /
#   cert_file_group / cert_file_mode / verify_port
#                                 same meaning as apache_deploy's own
#                                 variables (see this directory's
#                                 argument_spec.yml) -- per-server override;
#                                 reload_command/preflight_validation_command
#                                 fall back to the same ansible_os_family
#                                 auto-detection apache_deploy uses when
#                                 omitted
#
# Everything else (acme_flow, acme_account_email, the private/public flow
# variables, enrollment variables) is shared across the whole run -- set once
# via vars_files/extraVars, same as every other playbook in this collection.
#
# This file (roles_reference/apache_multi_deploy/main.yml) is the untouched,
# shipped baseline -- see roles/README.md for the full three-tier resolution
# order (a disk override under roles/apache_multi_deploy/main.yml, or a
# Mongo-saved edit from PUT /aapIntegration/playbooks/files/apache_multi_deploy,
# both take precedence over this file).

- name: Build a throwaway inventory from deploy_targets
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Assert deploy_targets is a non-empty list
      assert:
        that:
          - deploy_targets is defined
          - deploy_targets | length > 0
        fail_msg: >-
          deploy_targets must be a non-empty list of {host, ...} objects --
          see this playbook's header comment for the full per-server schema.

    - name: Register each explicit server as a dynamic inventory host
      add_host:
        name: "{{ item.host }}"
        groups: apache_multi_targets
        ansible_host: "{{ item.ansible_host | default(item.host) }}"
        ansible_user: "{{ item.ansible_user | default(omit) }}"
        ansible_port: "{{ item.ansible_port | default(omit) }}"
        ansible_ssh_private_key_file: "{{ item.ansible_ssh_private_key_file | default(omit) }}"
        ansible_password: "{{ item.ansible_password | default(omit) }}"
        ansible_become_password: "{{ item.ansible_become_password | default(omit) }}"
        _target_common_name: "{{ item.common_name | default(item.host) }}"
        _target_subject_alt_names: "{{ item.subject_alt_names | default([]) }}"
        _target_reload_command: "{{ item.reload_command | default(omit) }}"
        _target_preflight_validation_command: "{{ item.preflight_validation_command | default(omit) }}"
        _target_cert_file_owner: "{{ item.cert_file_owner | default(omit) }}"
        _target_cert_file_group: "{{ item.cert_file_group | default(omit) }}"
        _target_cert_file_mode: "{{ item.cert_file_mode | default(omit) }}"
        _target_verify_port: "{{ item.verify_port | default(omit) }}"
      loop: "{{ deploy_targets }}"
      loop_control:
        label: "{{ item.host }}"
      no_log: false

- name: Issue/renew and install the certificate on every explicit Apache server
  hosts: apache_multi_targets
  become: true
  vars_files:
    - "{{ playbook_dir }}/../_acme_lib/vars/defaults.yml"
    - "{{ playbook_dir }}/../_acme_lib/vars/dns_provider_map.yml"
  vars:
    common_name: "{{ _target_common_name }}"
    subject_alt_names: "{{ _target_subject_alt_names }}"
    apache_ssl_dir: "/etc/apache2/ssl/{{ common_name }}"
    acme_cert_file: "{{ apache_ssl_dir }}/cert.pem"
    acme_key_file: "{{ apache_ssl_dir }}/key.pem"
    acme_fullchain_file: "{{ apache_ssl_dir }}/fullchain.pem"
    acme_ca_file: "{{ apache_ssl_dir }}/chain.pem"
    acme_reload_cmd: "{{ reload_command }}"
    # Debian/Ubuntu use "apache2", RHEL/CentOS use "httpd" -- override per target.
    reload_command: >-
      {{ _target_reload_command | default(
           'systemctl reload apache2' if ansible_os_family == 'Debian' else 'systemctl reload httpd'
         ) }}
    preflight_validation_command: >-
      {{ _target_preflight_validation_command | default(
           'apache2ctl configtest' if ansible_os_family == 'Debian' else 'httpd -t'
         ) }}
    cert_file_owner: "{{ _target_cert_file_owner | default('root') }}"
    cert_file_group: "{{ _target_cert_file_group | default('root') }}"
    cert_file_mode: "{{ _target_cert_file_mode | default('0640') }}"
    verify_port: "{{ _target_verify_port | default(443) }}"

  tasks:
    - name: Run the pre-flight validation command
      command: "{{ preflight_validation_command }}"
      when: preflight_validation_command | length > 0
      changed_when: false

    - name: Issue/renew the certificate and install it for Apache
      import_tasks: "{{ playbook_dir }}/../_acme_lib/tasks/issue_linux.yml"

    - name: Set ownership/permissions on the installed certificate material
      file:
        path: "{{ item }}"
        owner: "{{ cert_file_owner }}"
        group: "{{ cert_file_group }}"
        mode: "{{ cert_file_mode }}"
      loop:
        - "{{ acme_cert_file }}"
        - "{{ acme_key_file }}"
        - "{{ acme_fullchain_file }}"
        - "{{ acme_ca_file }}"

    - name: Enroll a publicly-issued certificate back into CertSecure
      import_tasks: "{{ playbook_dir }}/../_acme_lib/tasks/enroll_public_ca.yml"
      when: acme_flow == 'public'

    - name: Verify Apache is serving the new certificate
      shell: >-
        echo | openssl s_client -connect 127.0.0.1:{{ verify_port }}
        -servername {{ common_name }} 2>/dev/null | openssl x509 -noout -enddate
      register: _verify_result
      changed_when: false
      failed_when: false

    - name: Report verification result
      debug:
        msg: "{{ _verify_result.stdout | default('Could not verify -- check verify_port/common_name.') }}"
