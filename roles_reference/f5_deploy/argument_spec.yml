---
# Variable contract for f5_deploy, surfaced by
# GET /aapIntegration/playbooks/files so the UI can pre-fill extra vars.
# Merged with roles_reference/_acme_lib/vars/argument_spec.yml's shared
# variables (this file wins on a name collision). Internal derived variables
# (f5_cert_staging_dir, acme_cert_file/key_file/fullchain_file/ca_file,
# acme_reload_cmd, _f5_provider) are deliberately not listed here -- they're
# computed from the variables below, not something a caller should set
# directly. See f5_multi_deploy/argument_spec.yml for the explicit-list
# equivalent (deploy_targets). Prose source of truth:
# docs/design/acme-playbook-variables.md.

variables:
  - name: bigip_host
    type: str
    required: true
    default: null
    secret: false
    description: BIG-IP management IP/FQDN.
    choices: null

  - name: bigip_port
    type: int
    required: false
    default: 443
    secret: false
    description: BIG-IP management API port.
    choices: null

  - name: bigip_user
    type: str
    required: true
    default: null
    secret: false
    description: BIG-IP admin username. No default -- always supply via extraVars/host_vars.
    choices: null

  - name: bigip_password
    type: str
    required: true
    default: null
    secret: true
    description: BIG-IP admin password. No default -- always supply via extraVars/host_vars.
    choices: null

  - name: bigip_validate_certs
    type: bool
    required: false
    default: true
    secret: false
    description: Set false only for a lab BIG-IP with a self-signed management cert.
    choices: null

  - name: partition
    type: str
    required: false
    default: "Common"
    secret: false
    description: BIG-IP partition the certificate/profile/virtual server live in.
    choices: null

  - name: ssl_cert_name
    type: str
    required: false
    default: "{{ common_name }}"
    secret: false
    description: BIG-IP object name for the uploaded certificate/key pair.
    choices: null

  - name: client_ssl_profile_name
    type: str
    required: false
    default: "{{ ssl_cert_name }}-clientssl"
    secret: false
    description: Client-SSL profile to create/update with the new cert/key.
    choices: null

  - name: virtual_server_name
    type: str
    required: false
    default: null
    secret: false
    description: >-
      Attach client_ssl_profile_name to this virtual server's clientSSL
      profile list if not already attached. Leave unset if the profile is
      already attached and this run only rotates the cert/key it points at.
    choices: null

  - name: verify_host
    type: str
    required: false
    default: null
    secret: false
    description: Host to TLS-probe for the post-deploy verification check. Defaults to common_name.
    choices: null

  - name: verify_port
    type: int
    required: false
    default: 443
    secret: false
    description: Port to TLS-probe for the post-deploy verification check. Set to "" to skip.
    choices: null
